<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- SOURCE for og-en.jpg (English page, dateless; built from og-source-211.html 16.9). Render:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu \
       --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 \
       --virtual-time-budget=6000 --screenshot=og-en.png "file://$PWD/og-source-211.html"
     then: sips -s format jpeg -s formatOptions 82 og-en.png --out og-en.jpg
     Geometry measured off the 15.9 card so this is a faithful rebuild, not a redesign.
     The only intended change (Anat, 16.9): the "is" is bold. Instrument Serif ships no bold
     cut (ital@0;1 only), so weight comes from a stroke in the same gold, which keeps the
     letterform and reads as bold at this size. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden;background:#0B1020;}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;}
  img.bg{position:absolute;inset:0;width:1200px;height:630px;object-fit:cover;object-position:50% 46%;}
  .veil{position:absolute;inset:0;
    background:
      linear-gradient(90deg, rgba(11,16,32,.88) 0%, rgba(11,16,32,.78) 40%, rgba(11,16,32,.50) 64%, rgba(11,16,32,.38) 100%),
      linear-gradient(180deg, rgba(11,16,32,.46) 0%, rgba(11,16,32,.24) 38%, rgba(11,16,32,.62) 100%);}
  .kicker{position:absolute;left:72px;top:64px;font-family:'IBM Plex Mono',monospace;font-size:16px;
    font-weight:500;letter-spacing:.20em;color:#6E9BFF;}
  h1{position:absolute;left:70px;top:134px;margin:0;font-family:'Instrument Serif',serif;font-weight:400;
    font-size:119px;line-height:1.042;letter-spacing:-.015em;color:#EDE9DF;}
  h1 em{font-style:italic;color:#F2C230;-webkit-text-stroke:1.8px #F2C230;paint-order:stroke fill;}
  .pill{position:absolute;left:72px;top:430px;box-sizing:border-box;height:72px;
    display:inline-flex;align-items:center;gap:16px;padding:0 34px;
    border:2px solid #F2C230;border-radius:999px;
    font-family:'IBM Plex Mono',monospace;font-size:31.5px;font-weight:500;letter-spacing:.09em;color:#F2C230;}
  .pill .dot{width:12px;height:12px;border-radius:50%;background:#E0413A;display:inline-block;}
  .site{position:absolute;left:72px;top:541px;font-family:'IBM Plex Mono',monospace;font-size:16px;
    letter-spacing:.05em;color:#B9BCC8;}
</style>
</head>
<body>
<div class="card">
  <img class="bg" src="img/room-sunset.jpg" alt="">
  <div class="veil"></div>
  <div class="kicker">CONNECTING THE DOTS &nbsp;·&nbsp; ANAT WEISSMAN</div>
  <h1>The Human<br><em>is</em> the Loop</h1>
  <div class="pill"><span class="dot"></span>A KEYNOTE FOR YOUR ROOM</div>
  <div class="site">thehumanistheloop.co/en</div>
</div>
</body>
</html>
